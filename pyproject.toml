[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kirospan"
version = "1.1.0"
description = "Local OpenAI- and Anthropic-compatible gateway for the Kiro runtime"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["kiro", "openai", "anthropic", "gateway", "fastapi", "hermes-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "PyYAML==6.0.3",
]

[project.scripts]
kirospan = "gateway.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests", "legacy"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "e2e: requires a running gateway and real Kiro credentials",
    "slow: long-running tests (stream stability, large payloads)",
    "upstream: performs requests against the Kiro runtime",
]
