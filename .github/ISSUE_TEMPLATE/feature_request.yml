name: Feature request
description: Propose a focused, responsible improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user need without including private account data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome and protocol impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: responsible_use
    attributes:
      label: Responsible-use check
      options:
        - label: This request does not bypass quotas, suspensions, access controls, or provider policies.
          required: true
