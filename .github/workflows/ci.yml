name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip '.[dev]'

      - name: Ejecutar pruebas sin credenciales reales
        run: python -m pytest -m 'not e2e'

      - name: Verificar compilación
        run: python -m py_compile kiro_gateway.py

      - name: Construir wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
